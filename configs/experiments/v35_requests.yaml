# v3.5 Critical 3: the SQL step in request mode. The model no longer writes SQL: it states what the question asks of
# the tables (the table, and the values the question states), and code checks every value against the question and
# the schema card, decides "not in the tables" and "ask", builds the query and does the arithmetic
# (policy_rag/table_requests.py). Everything else is v35.yaml.
#   policy-rag evaluate --config configs/experiments/v35_requests.yaml --name v35_c3 --splits dev test
#   policy-rag evaluate-sql --config configs/experiments/v35_requests.yaml --testset <private set> --name sql_c3 \
#       --splits dev held_out
extends: v35.yaml
sql:
  mode: request
